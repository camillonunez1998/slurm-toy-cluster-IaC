# Keep the addresses in sync with the `nodes` variable in terraform/variables.tf.
all:
  vars:
    ansible_user: cloud-user
    ansible_ssh_private_key_file: ~/.ssh/toy-cluster
  children:
    slurm_controller:
      hosts:
        controller:
          ansible_host: 192.168.100.10
    slurm_compute:
      hosts:
        compute1:
          ansible_host: 192.168.100.11
        compute2:
          ansible_host: 192.168.100.12
