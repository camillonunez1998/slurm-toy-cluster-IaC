- name: Install munge
  ansible.builtin.dnf:
    name: munge
    state: present

- name: Create the munge key on the controller
  ansible.builtin.command:
    cmd: mungekey --create --keyfile /etc/munge/munge.key
    creates: /etc/munge/munge.key
  when: inventory_hostname in groups['slurm_controller']

- name: Read the munge key from the controller
  ansible.builtin.slurp:
    src: /etc/munge/munge.key
  delegate_to: "{{ groups['slurm_controller'][0] }}"
  run_once: true
  register: munge_controller_key
  no_log: true

- name: Read the munge key currently on each node
  ansible.builtin.slurp:
    src: /etc/munge/munge.key
  register: munge_current_key
  failed_when: false
  no_log: true

- name: Distribute the munge key to the other nodes
  ansible.builtin.shell:
    cmd: base64 -d > /etc/munge/munge.key
    stdin: "{{ munge_controller_key.content }}"
  when:
    - inventory_hostname not in groups['slurm_controller']
    - munge_current_key.content | default('') != munge_controller_key.content
  notify: Restart munge
  no_log: true

- name: Set munge key ownership and permissions
  ansible.builtin.file:
    path: /etc/munge/munge.key
    owner: munge
    group: munge
    mode: "0400"

- name: Start munge
  ansible.builtin.service:
    name: munge
    state: started
    enabled: true
